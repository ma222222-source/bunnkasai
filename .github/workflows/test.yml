# 自動テスト（tests/）。GAS は模擬するので本番のシートには触らない。公開リポジトリは無料枠で動く
name: test
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # package-lock.jsonのPlaywrightと同じ公式イメージ。毎回aptでOS部品を取る待ちを避ける。
    # Playwright更新時は、このタグと下の版チェックも一緒に更新する。
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 50
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: Check image version and browser runtime
        run: |
          node -e "if(require('@playwright/test/package.json').version!=='1.63.0')throw Error('Update the Playwright container tag to match package-lock.json')"
          python3 --version
          node -e "(async()=>{for(const type of ['chromium','webkit']){const b=await require('playwright')[type].launch();await b.close();console.log(type+' ready');}})().catch(e=>{console.error(e);process.exit(1)})"
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results
          retention-days: 7
